services:
  cam-bot:
    build: .
    env_file:
      - .env
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/video2:/dev/video2"
      - "/dev/snd:/dev/snd"
    volumes:
      - "./mo_beliefs.json:/app/mo_beliefs.json"
      - "/run/dbus/system_bus_socket:/run/dbus/system_bus_socket"
    restart: always
